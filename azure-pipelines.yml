name: 3.2.$(Rev:r)

resources:
- repo: self

trigger:
  branches:
    include:
    - master

pool:
  vmImage: 'ubuntu-latest'
  
steps:
- checkout: self
  clean: true

- task: UseDotNet@2 
  displayName: "Install .NET"
  inputs:
    version: '9.0.x'
    packageType: sdk
    
- script: |
    dotnet tool install -g dotnet-setversion --ignore-failed-sources
    dotnet tool update -g dotnet-setversion --ignore-failed-sources
    cd src/Adliance.QmDoc
    setversion $(Build.BuildNumber)
  displayName: 'Set Version'

- task: UseDotNet@2
  displayName: "Install .NET"
  inputs:
    version: '11.0.x'
    packageType: sdk

- task: DotNetCoreCLI@2
  displayName: Restore
  inputs:
    command: restore
    projects: './src/Adliance.QmDoc/Adliance.QmDoc.csproj'

- task: DotNetCoreCLI@2
  displayName: Build
  inputs:
    projects: './src/Adliance.QmDoc/Adliance.QmDoc.csproj'
    arguments: '--configuration Release'

- script: >
    dotnet test
    --project ./test/Adliance.QmDoc.Tests/Adliance.QmDoc.Tests.csproj
    --configuration Release
    --results-directory "$(Agent.TempDirectory)/TestResults"
    --report-trx
    --coverage
    --coverage-output-format cobertura
    --coverage-output coverage.cobertura.xml
    --coverage-settings ./test/Adliance.QmDoc.Tests/coverage.config
  displayName: Test

- task: PublishTestResults@2
  displayName: Publish Test Results
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: VSTest
    testResultsFiles: '$(Agent.TempDirectory)/TestResults/**/*.trx'
    failTaskOnMissingResultsFile: true

- task: PublishCodeCoverageResults@2
  displayName: Publish Code Coverage
  condition: succeededOrFailed()
  inputs:
    summaryFileLocation: '$(Agent.TempDirectory)/TestResults/coverage.cobertura.xml'

- task: DotNetCoreCLI@2
  displayName: Pack
  inputs:
    command: pack
    packagesToPack: './src/Adliance.QmDoc/*.csproj'
    arguments: '--configuration Release --output $(Build.ArtifactStagingDirectory)'
    versioningScheme: byBuildNumber
    
- task: PublishBuildArtifacts@1
  displayName: Publish Artifact
  inputs:
    PathToPublish: '$(Build.ArtifactStagingDirectory)'    
        
- task: DotNetCoreCLI@2
  displayName: Push
  inputs:
    command: 'custom'
    custom: 'nuget'
    arguments: >
      push "$(Build.ArtifactStagingDirectory)/*.nupkg"
      --source "https://api.nuget.org/v3/index.json"
      --api-key "$(NUGET_API_KEY)"

