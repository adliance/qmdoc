<!DOCTYPE html>

<html lang="de" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8"/>
    <title>{{ TITLE }}</title>
    <link href="https://fonts.googleapis.com/css?family=Ubuntu:400,700&display=swap" rel="stylesheet">
    {{ CSS }}
    <style>
        .footer {
            margin-top: 15px;
            font-size: 14px;
            text-align: left;
        }

        /* comes first in the HTML, so that the title uses the whole width next to (and, when it wraps, below) the page number */
        .page-number {
            float: right;
            white-space: nowrap;
            padding-left: 20px;
        }

        .version {
            font-size: 12px;
            margin-top: 2px;
        }

        .version:empty {
            display: none;
        }
    </style>
</head>
<body>

<div class="footer">
    <div class="page-number"><span class="current-page"></span> | <span class="total-pages"></span></div>
    <div>{{TITLE}}</div>
    <div class="version">{{GIT_DATE_VERSION}}</div>
</div>

</body>
</html>
